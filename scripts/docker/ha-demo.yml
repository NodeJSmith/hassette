services:
  homeassistant:
    image: homeassistant/home-assistant:${HA_VERSION}
    container_name: "hassette-demo-ha"
    ports:
      - "127.0.0.1:${DEMO_HA_PORT:-18123}:8123"
    volumes:
      - "${HA_CONFIG_PATH:-../../tests/fixtures/demo-ha-config}:/config"
    restart: "no"
    # HA_ACCESS_TOKEN (scripts/docker/.env) must match tests/fixtures/demo-ha-config/.storage/auth
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8123/api/", "-H", "Authorization: Bearer ${HA_ACCESS_TOKEN}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  hassette:
    build:
      context: ../..
      dockerfile: scripts/docker/Dockerfile.hassette-dev
      args:
        UID: "${HOST_UID:-1000}"
        GID: "${HOST_GID:-1000}"
    container_name: "hassette-demo-hassette"
    ports:
      - "127.0.0.1:${DEMO_HASSETTE_PORT:-18126}:8126"
    volumes:
      - "../..:/app"
      - "../../.demo-data:/app/.demo-data"
    environment:
      HASSETTE__BASE_URL: "http://homeassistant:8123"
      # HA_ACCESS_TOKEN (scripts/docker/.env) must match tests/fixtures/demo-ha-config/.storage/auth
      HASSETTE__TOKEN: "${HA_ACCESS_TOKEN}"
      # DEMO_AUTH_TOKEN (scripts/docker/.env), also read by capture_screenshots.py and demo-verify
      HASSETTE__WEB_API__AUTH_TOKEN: "${DEMO_AUTH_TOKEN}"
      HASSETTE__WEB_API__PORT: "8126"
      HASSETTE__APPS__DIRECTORY: "/app/examples"
      HASSETTE__DATA_DIR: "/app/.demo-data"
    depends_on:
      homeassistant:
        condition: service_healthy
    restart: "no"
    healthcheck:
      # /api/health/live is the one FR#1 exemption exempt from auth -- /api/health itself now
      # requires a credential (design/specs/091-web-api-auth/design.md), which would otherwise
      # fail this healthcheck unconditionally under the auth token set above.
      test: ["CMD", "curl", "-sf", "http://localhost:8126/api/health/live"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  vite:
    build:
      context: ../..
      dockerfile: scripts/docker/Dockerfile.vite-dev
    container_name: "hassette-demo-vite"
    ports:
      - "127.0.0.1:${DEMO_VITE_PORT:-15173}:5173"
    volumes:
      - "../../frontend:/app/frontend"
      - "/app/frontend/node_modules"
    environment:
      VITE_PROXY_TARGET: "http://hassette:8126"
    depends_on:
      hassette:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5173"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 10s
