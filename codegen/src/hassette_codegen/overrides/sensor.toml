[[property_overrides]]
name = "unit_of_measurement"
type = "str | None"
add = true

[[property_overrides]]
name = "native_value"
remove = true

[[property_overrides]]
name = "native_unit_of_measurement"
remove = true

[[property_overrides]]
name = "suggested_display_precision"
remove = true

# Widened for #1752 (confirmed genuine-risk platform assignment -- atag/sensor.py assigns a
# third-party library's raw return value straight to device_class -- not a general scanner; see
# media_player.toml for the numeric-widening equivalent, #1751). No write-side mirror: sensor is
# a read-only domain, no corresponding entity command exists.
#
# union_mode="left_to_right" (enum listed first) makes Pydantic try enum coercion before falling
# back to plain str -- without it, smart-union mode always matches plain str first, so every
# incoming value (even a valid enum member, which is what HA sends over the wire in the vast
# majority of cases) would deserialize as str instead of the enum.
[[property_overrides]]
name = "device_class"
type = "SensorDeviceClass | str | None"
union_mode = "left_to_right"

[[property_overrides]]
name = "state_class"
type = "SensorStateClass | str | None"
union_mode = "left_to_right"
