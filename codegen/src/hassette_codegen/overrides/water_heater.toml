# HA 2026.11 renamed these entity properties to native_*; map them back to the pre-rename field names so the
# generated model doesn't change. The target_temperature* field names come from HA's entity properties, but
# state_attributes/capability_attributes send them under different keys (WaterHeaterStateAttribute,
# WaterHeaterCapabilityAttribute), so `aliases` maps the wire keys.
[[property_overrides]]
name = "native_current_temperature"
wire_name = "current_temperature"

[[property_overrides]]
name = "native_target_temperature"
wire_name = "target_temperature"

[[property_overrides]]
name = "native_target_temperature_high"
wire_name = "target_temperature_high"

[[property_overrides]]
name = "native_target_temperature_low"
wire_name = "target_temperature_low"

[[property_overrides]]
name = "native_temperature_unit"
wire_name = "temperature_unit"

# Keyed on the final field names (after any native_* rename above), so they apply on either side of HA 2026.11.
[[property_overrides]]
name = "target_temperature"
aliases = ["temperature"]

[[property_overrides]]
name = "target_temperature_high"
aliases = ["target_temp_high"]

[[property_overrides]]
name = "target_temperature_low"
aliases = ["target_temp_low"]

[[property_overrides]]
name = "target_temperature_step"
aliases = ["target_temp_step"]
