[build-system]
requires = ["uv_build>=0.10.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "hassette"
version = "0.52.0"
description = "Hassette is a simple, modern, async-first Python framework for building Home Assistant automations."
readme = "README.md"
authors = [{ name = "Jessica", email = "12jessicasmith34@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
keywords = [
    "home-assistant",
    "automation",
    "async",
    "typed",
    "framework",
    "smart-home",
    "iot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.14.3",  # PYSEC-2026-3545/3546/3547 fixed in 3.14.2/3.14.3
    "jsonref>=1.1.0",
    "cyclopts>=4.0,<5.0",
    "httpx2>=2.0.0",  # pydantic's continuation of httpx; starlette 1.3+ prefers it
    "aiosqlite>=0.20",
    "anyio>=4.10.0",
    "structlog>=24.4",
    "fastapi>=0.134.0",
    "starlette>=1.3.1",  # explicit floor for CVE-2026-48710, CVE-2026-54282/54283 fixes
    "croniter>=6.0.0",
    "deepdiff>=8.6.1",
    "fair-async-rlock>=1.0.7",
    "frozendict>=2.4.7",
    "glom>=24.11.0",
    "humanize>=4.13.0",
    "mergedeep>=1.3.4",
    "orjson>=3.10.18",
    "packaging>=25.0",
    "platformdirs>=4.3.8",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "python-slugify>=8.0",
    "tenacity>=9.1.2",
    "typing-extensions==4.15.*",
    "uuid-utils>=0.9.0",
    "uvicorn[standard]>=0.34.0",
    "watchfiles>=1.1.0",
    "whenever==0.10.*",
    "tomli-w>=1.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=1.0.0"]

[project.urls]
Homepage = "https://github.com/nodejsmith/hassette"
Repository = "https://github.com/nodejsmith/hassette"
Documentation = "https://github.com/nodejsmith/hassette#readme"
"Bug Reports" = "https://github.com/nodejsmith/hassette/issues"
Changelog = "https://github.com/nodejsmith/hassette/blob/main/CHANGELOG.md"


[dependency-groups]
dev = [
    "bcrypt>=4.0",
    "hassette-codegen",
    "house-lint>=0.1.1",
    "pyright>=1.1.408",
    "shot-scraper>=1.5",
    "slotscheck>=0.19.1",
]
test = [
    "coverage[toml]>=7.10.7",
    "nox>=2025.5.1",
    "playwright>=1.52.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "pytest-playwright>=0.6.2",
    "pytest-randomly>=3.16.0",
    "pytest-rerunfailures>=15.0",
    "pytest-repeat>=0.9.4",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pytest>=8.4.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocs-autorefs>=0.5.0",
    "mkdocstrings[python]>=0.25.0",
    "pymdown-extensions>=10.8.1",
    "watchdog>=6.0.0",
    "ruff>=0.14.9",
    "mkdocs-glightbox>=0.5.2",
    "mkdocs-panzoom-plugin>=0.5.2",
]

[tool.uv]
default-groups = ["dev", "test", "docs"]

[tool.uv.sources]
hassette-codegen = { path = "codegen", editable = true }

[project.scripts]
hassette = "hassette.__main__:entrypoint"

[tool.uv.build-backend]
module-name = "hassette"

[tool.pytest.ini_options]
pythonpath = ["src", "tools", "tools/frontend", "scripts"]
# ".*" restores pytest's default skip of dot-directories, which a custom norecursedirs otherwise
# clobbers — without it, collection descends into .claude/worktrees, .venv, .nox from the repo root.
norecursedirs = [".*", "codegen", "tests/pyright_probes"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "error",
    # Do NOT escalate HassetteBlockingIOWarning to a fatal error suite-wide. The Tier 2 guard
    # patches process-global builtins/socket/os; under pytest the event loop runs on the main
    # thread, so while the guard is installed in a test, an open()/socket call made by pytest,
    # coverage, or xdist's execnet transport on that same thread is intercepted. Escalated to an
    # error inside framework code, that raise killed xdist workers (INTERNALERROR, no traceback).
    # Tests that assert the guard raises opt in locally via filterwarnings("error", ...).
    "default::hassette.exceptions.HassetteBlockingIOWarning",
    "default:.*does not declare restart_spec.*:UserWarning",
    # ResourceWarning stays escalated to error (via the global "error" above). These were
    # previously downgraded to mask a leak where a fatal-cascade system test orphaned service
    # tasks onto the shared session-scoped event loop, leaving aiosqlite/aiohttp/anyio handles
    # unclosed (issue #1101). The fix is structural — the destructive system tests now run on
    # function-scoped loops (see the loop_scope markers in tests/system/test_shutdown.py and
    # test_reconnection.py) so a crashed instance's tasks are reaped at loop teardown. Keeping
    # ResourceWarning fatal ensures the leak can't return silently.
    "default:Top-level \\[apps\\.\\*\\]:DeprecationWarning:hassette\\.config\\.classes",
    # Resource._shutdown_children() passes eagerly-created `child.shutdown()` coroutines to
    # asyncio.gather(*[...]). gather() wraps each one via ensure_future()/create_task() as it
    # iterates; if the TaskBucket seals mid-iteration (a real scenario a forced-shutdown test
    # can trigger — see test_run_forever_cleans_up_detectors_when_db_start_fails), the
    # not-yet-wrapped sibling coroutines are abandoned and later trigger a
    # "coroutine was never awaited" RuntimeWarning when GC finally reclaims them at session
    # end, surfaced by pytest as an unraisable-exception session error. This does not mask the
    # sealed-rejection RuntimeError itself (still raised/logged); it only prevents an
    # incidental GC artifact of that intentional rejection from aborting the whole session.
    # The underlying gather() orphaning is a separate, pre-existing base.py issue to track and
    # fix independently, not something a test-side filter should paper over long-term.
    # Tracked in https://github.com/NodeJSmith/hassette/issues/1720.
    #
    # Two Python versions, two message formats for the identical "coroutine was never awaited"
    # unraisable exception: 3.14 reports "Exception ignored while finalizing coroutine
    # <coroutine object Resource.shutdown ...>: None"; 3.11-3.13 report "Exception ignored in:
    # <coroutine object Resource.shutdown ...>" instead. Both must be matched or the filter only
    # suppresses on whichever version it was last verified against (confirmed via CI: this
    # entry previously matched only 3.14 and left 3.11/3.12/3.13 failing on the exact
    # PytestUnraisableExceptionWarning it was meant to silence).
    # The literal ":" in "Exception ignored in:" is replaced below with "." — a regex wildcard
    # that still matches that colon at runtime — because pytest's filterwarnings parser naively
    # splits the whole config string on literal ":" characters into
    # action/message/category/module/lineno fields, so a real colon inside the message text (as
    # opposed to inside a bracketed regex class) shifts every field after it and breaks parsing
    # entirely — confirmed by reproducing the resulting ModuleNotFoundError locally.
    "default:(Exception ignored in.|Exception ignored while finalizing coroutine) <coroutine object Resource\\.shutdown:pytest.PytestUnraisableExceptionWarning",
]
# Skip Docker/system/e2e tests by default (run explicitly: pytest -m docker / -m e2e / nox -s system).
# e2e must not mix into ad-hoc runs: Playwright breaks the session-scoped asyncio loop for every
# async test that runs after it in the same process ("Runner.run() cannot be called from a running
# event loop"). nox and CI pass their own -m, which overrides this.
addopts = "-m 'not docker and not system and not system_destructive and not e2e'"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "docker: marks tests that require Docker and are slow (run explicitly with '-m docker')",
    "e2e: marks browser-based end-to-end tests requiring Playwright (run explicitly with '-m e2e')",
    "system: marks system tests requiring a running HA Docker container (run explicitly with 'nox -s system')",
    "system_destructive: system tests that restart HA or inject failures — run in isolation after normal system tests",
]

[tool.coverage.run]
branch = true         # measure branch coverage, not just lines
source = ["hassette"] # your packages/modules
parallel = true       # enable combining across workers/CI shards
relative_files = true # stable paths in CI
# Measure xdist workers (subprocesses). The nox coverage sessions install a .pth
# file + COVERAGE_PROCESS_START so tracing starts at interpreter startup — before
# conftest imports — instead of relying on pytest-cov's later attach.
concurrency = ["thread", "multiprocessing"]
omit = [
    "*/__init__.py",
    "*/__main__.py",
    # Pure data definitions — no logic to test
    "*/models/states/*",     # codegen output (base.py/catalog.py have logic but are collateral)
    "*/models/entities/*",   # codegen output (base.py has logic but is collateral)
    "*/types/enums.py",      # StrEnum declarations
    "*/types/types.py",      # type aliases, TypedDicts, Protocols
    "*/const/*",             # literal constants
    "*/web/models.py",       # Pydantic response schemas
    "*/schemas/*",           # Pydantic query/telemetry schemas
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if (typing\\.)?TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# house-lint is a generalized extraction of this repo's former tools/check_lazy_imports.py,
# check_llm_cruft.py, check_type_checking_position.py, check_constants_position.py,
# check_spec_tokens.py, and check_exception_names.py (same author, verified rule-for-rule
# equivalent before the swap). check_file_size.py's rule (HSL102) is configured here too but
# selected only in the separate, non-blocking `file-sizes` CI job — see the comment on the
# house-lint prek hook in prek.toml for why it's excluded from the blocking hook.
#
# HSL001 AI-writing tells (divider comments, filler phrases) in comments/docstrings
# HSL002 imports inside function/method bodies ("lazy imports")
# HSL003 a top-level TYPE_CHECKING guard followed by a later top-level import
# HSL004 UPPER_CASE module constants defined after the first class/function
# HSL101 leaked spec-artifact tokens (AC#/FR#/NFR#/WP#/T##) in comments, docstrings, filenames
# HSL102 files over max_lines (tracked separately in CI, see above)
# HSL103 except-handler bindings that aren't named 'exc' or '*_exc'
[tool.house-lint]
include = ["src", "tests", "scripts", "tools", "codegen", "docs", "examples"]
select = ["HSL001", "HSL002", "HSL003", "HSL004", "HSL101", "HSL102", "HSL103"]

[tool.house-lint.rules.HSL102]
max_lines = 800

[tool.house-lint.rules.HSL103]
# '*_exc' is a suffix wildcard: matches any name ending in "_exc" (retry_exc, inner_exc, ...).
allowed = ["exc", "*_exc"]

# HSL101 has no default vocabulary — each family below is one token shape. AC/FR/NFR/WP and T
# each need two families: one for comments/docstrings (case-sensitive, since lowercase prose
# words like "tofu" or "frame" must not match) and one for filenames only (case-insensitive,
# since a leaked-token filename like `wp3_notes.py` should still be caught even though file
# names are conventionally lowercase). house-lint's `case_sensitive` flag applies to every
# scope in a family, so this split is required — a single family can't be case-sensitive for
# content and case-insensitive for filenames at once.

[[tool.house-lint.rules.HSL101.tokens]]
prefixes = ["AC", "FR", "NFR", "WP"]
hash = "optional"
min_digits = 1
suffix = "optional-lower-alpha"
scopes = ["comments", "docstrings"]
case_sensitive = true

[[tool.house-lint.rules.HSL101.tokens]]
prefixes = ["AC", "FR", "NFR", "WP"]
hash = "optional"
min_digits = 1
suffix = "optional-lower-alpha"
scopes = ["filenames"]
case_sensitive = false

# T needs min_digits = 2: a single digit would match ordinary TypeVar names like T1/T2 in
# prose/docstrings, which AC/FR/NFR/WP's multi-letter prefixes never collide with.
[[tool.house-lint.rules.HSL101.tokens]]
prefixes = ["T"]
min_digits = 2
scopes = ["comments", "docstrings"]
case_sensitive = true
# Excludes clock-time literals like "T00:00:00" (T + digits + ':' + digit) from matching —
# without this, ISO timestamp strings in docstrings/comments read as leaked task tokens.
not_followed_by_time = true

[[tool.house-lint.rules.HSL101.tokens]]
prefixes = ["T"]
min_digits = 2
scopes = ["filenames"]
case_sensitive = false
