[tools]
prek = "0.4.11"
python = ["3.14.8"]
uv = "latest"
java = "temurin-21.0.12+101.0.LTS" # PMD CPD (tools/check_duplicate_code.py) is a JVM tool
# Single version pin for these CLIs: CI installs them from this file via jdx/mise-action.
# oasdiff: tools/check_wire_compat.py and tools/check_client_floor.py (.github/actions/setup-oasdiff).
"github:oasdiff/oasdiff" = "1.32.1"
# muffet: docs link check (docs.yml link-check job).
"github:raviqqe/muffet" = "2.11.4"

[env]
# _.file = '.env'
_.python.venv = { path = ".venv" }

[tasks.install]
run = "uv sync"

[tasks.serve_docs]
run = "mkdocs serve --livereload"
depends = ["install"]

[tasks."worktree:setup"]
description = "Set up a new worktree (Python venv, plus frontend node_modules if frontend/ exists)"
run = """
uv sync
# frontend/ is absent on branches predating the React migration (see PR #343) -
# skip node_modules setup there instead of failing the whole task.
if [ -d frontend ]; then
  cd frontend && npm install
fi
"""
