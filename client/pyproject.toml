[build-system]
requires = ["uv_build>=0.10.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "hassette-client"
version = "0.54.0"  # x-release-please-version
description = "Async client for the Hassette HTTP and WebSocket API."
readme = "README.md"
authors = [{ name = "Jessica", email = "12jessicasmith34@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = ["hassette-wire==0.54.0"]  # x-release-please-version
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Populated with aiohttp, cyclopts and rich when the CLI moves here (#2387).
cli = []

[project.urls]
Homepage = "https://github.com/nodejsmith/hassette"
Repository = "https://github.com/nodejsmith/hassette"

[dependency-groups]
dev = ["pytest>=8.4.0"]

[tool.uv.sources]
hassette-wire = { workspace = true }

[tool.uv.build-backend]
module-name = "hassette_client"

[tool.pytest.ini_options]
testpaths = ["tests"]
