services:
  hassette:
    # ...the rest of the Docker Setup service, unchanged...
    volumes:
      - ./config:/config
      - data:/data
      - uv_cache:/uv_cache
      - ./myproject:/apps # add this line
    environment:
      - HASSETTE__LOGGING__LOG_LEVEL=info
      - TZ=America/New_York
      - HASSETTE__APPS__DIRECTORY=/apps/src/mypkg # add this line
