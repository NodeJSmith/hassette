# /hassette without the trailing slash would otherwise miss this location.
location = /hassette {
    return 301 /hassette/;
}

location /hassette/ {
    # The trailing slash on proxy_pass strips /hassette before the request reaches Hassette.
    proxy_pass http://hassette:8126/;
    # Always set, so a client-sent X-Forwarded-Prefix never passes through.
    proxy_set_header X-Forwarded-Prefix /hassette;

    # The live updates run over a WebSocket.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
