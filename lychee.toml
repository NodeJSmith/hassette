exclude = [
    # Badges use dynamic shields.io / fury.io URLs that rate-limit CI
    "badge\\.fury\\.io",
    "img\\.shields\\.io",
    "codecov\\.io/github/",
    # Star-history chart and link page
    "star-history\\.com",
    # GitHub project boards require authentication
    "github\\.com/users/.*/projects/",
    # Localhost URLs in CONTRIBUTING.md (dev server docs)
    "localhost",
    "127\\.0\\.0\\.1",
    # docs/reference/ is auto-generated by mkdocstrings gen-files plugin at build time
    "docs/reference/",
    # release-please compare URLs reference tags that don't exist until after merge
    "github\\.com/.*/compare/",
    # Bot protection intermittently answers CI with 403 Forbidden
    "opensource\\.org",
]

# Accept 429 (rate-limited) and 503 (GitHub throttling CI requests for blob pages) as non-fatal.
# A genuinely missing page answers 404, which still fails.
accept = [200, 429, 503]

# `/en/stable/` links are remapped onto docs/pages/ source files by the link-check job in
# .github/workflows/lint.yml (the remap needs the absolute checkout path, which this file can't
# express). These two settings make the remapped file:// URIs follow mkdocs' directory URLs:
# `/pages/foo/` -> docs/pages/foo.md, and a section root `/pages/foo/` -> docs/pages/foo/index.md.
# lychee can't scope them to remapped URIs, so they also apply to every relative local link.
fallback_extensions = ["md"]
index_files = ["index.md"]

# A snippet's relative links resolve from the page that includes it, not from the snippet's own
# directory, so lychee would check them against the wrong path. `mkdocs build --strict` checks them
# in the including page instead.
exclude_path = ["docs/pages/.*/snippets/"]

# Docs use RFC 1918 addresses (e.g. 192.168.1.10) as example hosts; a CI runner can't reach them.
exclude_private = true

max_concurrency = 4
timeout = 30
