exclude = [
    # Badges use dynamic shields.io / fury.io URLs that rate-limit CI
    "badge\\.fury\\.io",
    "img\\.shields\\.io",
    "codecov\\.io/github/",
    # Star-history chart and link page
    "star-history\\.com",
    # GitHub project boards require authentication
    "github\\.com/users/.*/projects/",
    # Localhost URLs in CONTRIBUTING.md (dev server docs)
    "localhost",
    "127\\.0\\.0\\.1",
    # docs/reference/ is auto-generated by mkdocstrings gen-files plugin at build time
    "docs/reference/",
    # release-please compare URLs reference tags that don't exist until after merge
    "github\\.com/.*/compare/",
    # Bot protection intermittently answers CI with 403 Forbidden
    "opensource\\.org",
]

# Accept 429 (rate-limited) and 503 (GitHub throttling CI requests for blob pages) as non-fatal.
# A genuinely missing page answers 404, which still fails.
accept = [200, 429, 503]

max_concurrency = 4
timeout = 30
