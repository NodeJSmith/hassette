name: Set up oasdiff
description: Install the oasdiff pinned in mise.toml, used by tools/check_wire_compat.py and tools/check_client_floor.py.

runs:
    using: composite
    steps:
        # Installs only oasdiff (not every tool in mise.toml) and puts it on PATH via mise's shims.
        # env: false keeps mise.toml's [env] (the .venv activation) out of the job environment.
        - name: Install oasdiff
          uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
          with:
              install_args: github:oasdiff/oasdiff
              env: false
