name: Set up oasdiff
description: Install the pinned oasdiff used by tools/check_wire_compat.py and tools/check_client_floor.py.

runs:
    using: composite
    steps:
        - name: Set up Go
          uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
          with:
              go-version: "stable"
              cache: false

        # Version also pinned in mise.toml ("github:oasdiff/oasdiff") for local pre-push runs.
        - name: Install oasdiff
          shell: bash
          run: |
              go install github.com/oasdiff/oasdiff@v1.32.1
              echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
