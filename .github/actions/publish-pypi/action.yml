name: Publish package to PyPI
description: >-
    Uploads one package's dist directory to PyPI with retry-with-backoff. Shared by every
    publish-pypi-* job in release-please.yml.

# This is a composite action, not a reusable workflow, on purpose. PyPI matches a trusted
# publisher's workflow file against the OIDC `job_workflow_ref` claim, which names the workflow
# file that defines the *job*. A job defined in a reusable workflow reports that reusable file, so
# it would never match publishers registered against release-please.yml. A composite action runs
# inside the caller's job and leaves the claim untouched.

inputs:
    package-name:
        description: "Human-readable package name, used in step names and warning messages."
        required: true
    packages-dir:
        description: "Directory (relative to the workspace) holding this package's built dist files."
        required: true

runs:
    using: composite
    steps:
        - name: Download build artifacts
          uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
          with:
              name: pypi-dists
              path: "./dist"

        # No continue-on-error on attempt 3: the job fails hard if all three attempts fail,
        # which — via the caller's `needs:` chain — skips every package published after this one.
        - name: Publish ${{ inputs.package-name }} to PyPI (attempt 1)
          id: attempt1
          continue-on-error: true
          uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
          with:
              packages-dir: ${{ inputs.packages-dir }}
              skip-existing: true

        - name: Wait 30s before retry
          if: steps.attempt1.outcome == 'failure'
          shell: bash
          env:
              PACKAGE_NAME: ${{ inputs.package-name }}
          run: echo "::warning::$PACKAGE_NAME publish attempt 1 failed (likely transient Sigstore/network error), retrying..." && sleep 30

        - name: Publish ${{ inputs.package-name }} to PyPI (attempt 2)
          id: attempt2
          if: steps.attempt1.outcome == 'failure'
          continue-on-error: true
          uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
          with:
              packages-dir: ${{ inputs.packages-dir }}
              skip-existing: true

        - name: Wait 60s before retry
          if: steps.attempt2.outcome == 'failure'
          shell: bash
          env:
              PACKAGE_NAME: ${{ inputs.package-name }}
          run: echo "::warning::$PACKAGE_NAME publish attempt 2 failed, final retry..." && sleep 60

        - name: Publish ${{ inputs.package-name }} to PyPI (attempt 3)
          id: attempt3
          if: steps.attempt2.outcome == 'failure'
          uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
          with:
              packages-dir: ${{ inputs.packages-dir }}
              skip-existing: true
