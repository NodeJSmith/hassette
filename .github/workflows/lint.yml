name: Lint

on:
    push:
        branches: [main]
    pull_request:
        branches: [main, "release/**"]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            python: ${{ steps.filter.outputs.python }}
            frontend: ${{ steps.filter.outputs.frontend }}
            docs: ${{ steps.filter.outputs.docs }}
            codegen: ${{ steps.filter.outputs.codegen }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
              id: filter
              with:
                  filters: |
                      python:
                        - 'src/**'
                        - 'wire/**'
                        - 'client/**'
                        - 'tests/**'
                        - 'examples/**'
                        - 'codegen/**'
                        - 'docs/**'
                        - 'scripts/**'
                        - 'docker/**'
                        - 'pyproject.toml'
                        - 'pyrightconfig.json'
                        - 'uv.lock'
                        - 'ruff.toml'
                        - '_typos.toml'
                        - 'prek.toml'
                        - 'mise.toml'
                        - 'tools/**'
                        - '.github/workflows/lint.yml'
                        - '.github/actions/setup-oasdiff/**'
                      frontend:
                        - 'frontend/**'
                        - 'tools/**'
                        - '.github/workflows/lint.yml'
                      docs:
                        - '**/*.md'
                        - 'docs/**'
                        - 'lychee.toml'
                        - '.github/workflows/lint.yml'
                      codegen:
                        - 'src/hassette/models/**'
                        - 'src/hassette/const/**'
                        - 'codegen/**'
                        - '.generated-manifest'
                        # the root lock pins codegen's deps (jinja2, pyyaml)
                        - 'uv.lock'

    # Unfiltered on purpose: a secret can land in any tracked file (a root Dockerfile, a
    # workflow), not just the paths the `changes` filters cover.
    secrets:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Install prek
              uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2
              with:
                  install-only: true

            - name: Cache prek environments
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ~/.cache/prek
                  key: prek-secrets-${{ runner.os }}-${{ hashFiles('prek.toml') }}

            - name: Set up Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
              with:
                  go-version: "stable"
                  cache: false

            - name: Scan tracked tree for secrets
              run: prek run gitleaks-tree --all-files --stage pre-push

    python:
        needs: changes
        if: needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0 # prek's check-wire-compat hook (tools/check_wire_compat.py) needs release tags, not just the default shallow history

            - name: Install uv and set the Python version
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  python-version: "3.13"

            - run: uv sync

            - name: Install prek
              uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2
              with:
                  install-only: true

            - name: Cache prek environments
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ~/.cache/prek
                  key: prek-${{ runner.os }}-${{ hashFiles('prek.toml') }}

            - name: Set up oasdiff
              uses: ./.github/actions/setup-oasdiff

            - name: Run lint checks
              # gitleaks-tree runs in the unfiltered `secrets` job. The other two are local mirrors
              # of the `file-sizes` and `duplicate-code` jobs below, which gate against the PR's
              # exact base/head SHAs (and this job has no Java for PMD). Skip ids match prek.toml.
              run: |
                  uv tool install ruff==0.17.1
                  prek run --no-group frontend --all-files --stage pre-push \
                      --skip gitleaks-tree --skip check-file-size-regressions --skip check-duplicate-code

            - name: Fail if generators produced drift
              # Uses the generator's --check mode, which runs ruff on both the committed
              # file and the freshly generated content inside the same invocation. This
              # makes the comparison ruff-version-agnostic — the same ruff binary
              # normalizes both sides. A plain `git diff` approach would depend on the
              # prek hook and `uv tool install ruff==X` staying in lockstep.
              run: |
                  if ! uv run python codegen/src/hassette_codegen/sync_facade/ --target all --check; then
                    echo ""
                    echo "ERROR: generated files are out of date. Re-run locally and commit:"
                    echo "  uv run python codegen/src/hassette_codegen/sync_facade/ --target all"
                    echo ""
                    exit 1
                  fi

            - name: Check coordinator-internal annotations in core tests
              run: uv run python tools/check_coordinator_internal.py

    frontend:
        needs: changes
        if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install uv
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

            - name: Install prek
              uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2
              with:
                  install-only: true

            - name: Install frontend dependencies
              run: npm ci
              working-directory: frontend

            - name: Build frontend
              run: npm run build
              working-directory: frontend

            - name: Run frontend lint checks
              run: prek run --group frontend --all-files --show-diff-on-failure

    codegen-freshness:
        needs: changes
        if: needs.changes.outputs.codegen == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Python 3.14
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: "3.14"

            - name: Install uv
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

            - name: Cache HA core checkout
              id: cache-ha
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ha-core
                  key: ha-core-${{ hashFiles('codegen/ha-version.txt') }}

            - name: Clone HA core
              if: steps.cache-ha.outputs.cache-hit != 'true'
              run: git clone --depth 1 --branch $(cat codegen/ha-version.txt) https://github.com/home-assistant/core.git ha-core

            # codegen is a path dependency in the root project's dev group, so the root
            # environment carries it and its deps — there is no separate codegen venv.
            - name: Install dependencies
              run: uv sync

            - name: Run codegen unit tests
              run: uv run pytest codegen/tests -q --rootdir=codegen
              env:
                  HA_CORE_PATH: ${{ github.workspace }}/ha-core

            - name: Check entity codegen freshness
              run: uv run hassette-codegen generate --ha-core-path ha-core --check

    # Intentionally ungated — runs on every PR so HA version drift is always
    # visible, not just when codegen files change. See also ha-version-drift.yml
    # (daily cron that files a tracking issue when behind).
    ha-version-staleness:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  sparse-checkout: codegen/ha-version.txt

            - name: Check HA version staleness
              run: |
                  set -euo pipefail
                  PINNED=$(cat codegen/ha-version.txt)
                  LATEST=$(gh api repos/home-assistant/core/releases/latest --jq .tag_name 2>/dev/null || echo "")
                  if [ -z "$LATEST" ]; then
                      echo "::warning::Could not fetch latest HA release, skipping"
                      exit 0
                  fi
                  if [ "$PINNED" != "$LATEST" ]; then
                      echo "::warning::Pinned HA version ($PINNED) is behind latest ($LATEST). Run codegen bump when ready."
                  else
                      echo "Pinned HA version ($PINNED) matches latest release"
                  fi
              env:
                  GH_TOKEN: ${{ github.token }}

    security:
        needs: changes
        if: needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  python-version: "3.13"

            - name: Export requirements and audit
              run: |
                  uv export --frozen --no-hashes --no-emit-project --no-group dev --no-group test --no-group docs > requirements.txt
                  uvx pip-audit@2.10.0 -r requirements.txt \
                    --ignore-vuln CVE-2025-69872  # diskcache — no fix available yet (#861)

    lockfile-fresh:
        needs: changes
        if: needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  python-version: "3.13"

            # uv.lock pins the project's own version, so a pyproject version bump leaves it
            # stale until re-locked. CI installs with a plain `uv sync`, which silently re-resolves
            # and hides the drift — this gate makes a stale lock a loud, fixable red check instead.
            - name: Verify uv.lock is in sync with pyproject.toml
              run: |
                  if ! uv lock --check; then
                      echo "::error::uv.lock is out of sync with pyproject.toml — run 'uv lock' and commit the result"
                      exit 1
                  fi

    slotscheck:
        needs: changes
        if: needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: uv sync

            - name: Run slotscheck
              run: uv run slotscheck -m hassette

    link-check:
        needs: changes
        if: needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Check links
              uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
              with:
                  # RTD serves /en/stable/ from the last release, so a stable link to a page added since
                  # then would 404 live. Remap stable page links onto the docs source instead: a page that
                  # exists under docs/pages/ passes, a missing one still fails. The fragment is dropped
                  # (lychee does not check fragments here). The capture is lazy so an optional trailing slash
                  # falls to `/?` instead of $1; a greedy capture would remap `foo/` to a directory, not foo.md.
                  # The action `eval`s these args, so the remap is single-quoted to keep `$1` and the `$` anchor
                  # literal; that also blocks $GITHUB_WORKSPACE, so the path comes from github.workspace.
                  args: >-
                      README.md CONTRIBUTING.md 'docs/**/*.md' --config lychee.toml
                      --remap '^https://hassette\.readthedocs\.io/en/stable/pages/([^#]*?)/?(#.*)?$ file://${{ github.workspace }}/docs/pages/$1'
                  fail: true

    file-sizes:
        needs: changes
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # `gh pr view` in the gate step reads the PR's labels.
            pull-requests: read
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  # Full history, not the default shallow clone: the "new regressions" step below
                  # needs to reach this PR's merge-base, which a shallow fetch of just the checked-
                  # out ref won't include once the base branch has moved past the PR's branch point.
                  fetch-depth: 0
                  # actions/checkout's default ref on a pull_request event is GitHub's ephemeral
                  # merge commit (base + head merged), not the raw head commit. house-lint scans
                  # whatever's checked out, while the regressions step below is handed HEAD_SHA
                  # (the raw head) to diff against — pin the checkout to that same commit so both
                  # halves of this gate agree on which tree they're looking at.
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

            - name: Install uv
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  python-version: "3.13"

            - run: uv sync

            - name: Check file sizes (full backlog)
              # Runs on every trigger, including PRs (unlike duplicate-code's equivalent step,
              # which skips PRs to avoid a second expensive PMD scan) — house-lint is cheap
              # enough that running it twice per PR (once here, once inside the regressions
              # script below) costs nothing worth optimizing away.
              #
              # Deliberately NOT `--select HSL102`: narrowing selection disables every other
              # rule, and house-lint's always-on HSL900 then flags every `# house-lint:
              # ignore[HSL002]`-style pragma elsewhere in the repo as an "unused suppression
              # for disabled rule" — noise unrelated to file size. Running the full configured
              # rule set keeps those pragmas valid; today that set has zero real findings
              # outside HSL102, so this job's output is still file-size-only in practice.
              #
              # Informational only (continue-on-error) — tracks the ~20-file backlog without
              # blocking. The "new file-size regressions" step below is what actually gates PRs.
              continue-on-error: true
              run: uv run house-lint check

            - name: Check for new file-size regressions
              # Only meaningful on a PR — there's no "other side" to diff against on a direct
              # push to main (which only happens via a PR merge, already gated once as a PR).
              # The script resolves the actual merge-base itself from these raw refs.
              if: github.event_name == 'pull_request'
              # A failing result passes when the PR carries the script's ALLOW_LABEL; labels are
              # read live via `gh pr view` (PR_NUMBER), not from the event payload, which a re-run
              # reuses unchanged.
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  GH_TOKEN: ${{ github.token }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: uv run python tools/check_file_size_regressions.py "$BASE_SHA" "$HEAD_SHA"

    # PMD CPD scans both Python and TypeScript — trigger on either.
    duplicate-code:
        needs: changes
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # `gh pr view` in the gate step reads the PR's labels.
            pull-requests: read
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  # See the matching comment in the file-sizes job above — the gate step below
                  # needs this PR's merge-base, not just the default shallow history.
                  fetch-depth: 0
                  # See the matching comment in the file-sizes job above — pin the checkout to the
                  # raw head commit, not GitHub's ephemeral pull_request merge commit, so the PMD
                  # scan below and the HEAD_SHA it's diffed against describe the same tree.
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

            - name: Install uv
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  python-version: "3.13"

            - run: uv sync

            - name: Set up Java 21  # PMD CPD is a JVM tool
              uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Check duplicate code (full backlog)
              # Informational only (continue-on-error) — tracks the full backlog without
              # blocking. Runs only when there's no PR to gate against; on a PR, the step below
              # does its own head-tree scan and reports both the backlog (for context) and the
              # gate verdict, then a second merge-base-tree scan only when the head scan actually
              # found something to disambiguate (see check_duplicate_code.py's scan_tree_at_ref).
              if: github.event_name != 'pull_request'
              continue-on-error: true
              run: uv run python tools/check_duplicate_code.py

            - name: Check duplicate code (new-code gate)
              # The script resolves the actual merge-base itself from these raw refs.
              if: github.event_name == 'pull_request'
              # A failing result passes when the PR carries the script's ALLOW_LABEL; labels are
              # read live via `gh pr view` (PR_NUMBER), not from the event payload, which a re-run
              # reuses unchanged.
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  GH_TOKEN: ${{ github.token }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: uv run python tools/check_duplicate_code.py --gate-new-code "$BASE_SHA" "$HEAD_SHA"

    lint-complete:
        needs: [secrets, python, frontend, codegen-freshness, ha-version-staleness, security, lockfile-fresh, slotscheck, link-check, file-sizes, duplicate-code]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Report result
              run: |
                  failed="${{ contains(needs.*.result, 'failure') }}"
                  cancelled="${{ contains(needs.*.result, 'cancelled') }}"
                  if [[ "$failed" == "true" || "$cancelled" == "true" ]]; then
                      echo "One or more lint jobs failed or were cancelled"
                      exit 1
                  fi
                  echo "All lint checks passed or were skipped (no relevant changes)"
