name: Docs

on:
    push:
        paths:
            - "docs/**"
            - "mkdocs.yml"
            - "pyproject.toml"
            - "tools/docs/check_snippet_orphans.py"
            - "tools/docs/inventories.py"
            - "tools/docs/inventories/**"
            - ".github/workflows/docs.yml"
            - "mise.toml"
    pull_request:
        paths:
            - "docs/**"
            - "mkdocs.yml"
            - "pyproject.toml"
            - "tools/docs/check_snippet_orphans.py"
            - "tools/docs/inventories.py"
            - "tools/docs/inventories/**"
            - ".github/workflows/docs.yml"
            - "mise.toml"

    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Install uv and set the Python version
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: uv sync

            - name: Build docs (strict)
              run: uv run mkdocs build --strict

            - name: Check snippet orphans
              continue-on-error: true # TODO: remove after Phase 3 writing cleans up pre-existing orphans
              run: uv run python tools/docs/check_snippet_orphans.py

            - name: Upload site artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: docs-site
                  path: site/
                  retention-days: 1

    link-check:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            # Before the artifact download: checkout cleans the workspace. mise.toml must sit in the
            # working directory for the muffet shim to resolve its pinned version.
            - name: Checkout mise.toml
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  sparse-checkout: mise.toml
                  sparse-checkout-cone-mode: false

            - name: Download site artifact
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: docs-site
                  path: site/

            # Installs only muffet at the version pinned in mise.toml; env: false keeps mise.toml's
            # [env] (the .venv activation) out of the job environment.
            - name: Install muffet
              uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
              with:
                  install_args: github:raviqqe/muffet
                  env: false

            - name: Serve site
              run: python3 -m http.server 8000 -d site &

            - name: Wait for server
              run: timeout 10 bash -c 'until curl -s http://localhost:8000/ > /dev/null; do sleep 0.5; done'

            - name: Run muffet
              run: |
                  muffet http://localhost:8000/ \
                    --include '^http://localhost:8000' \
                    --timeout 30 \
                    --max-connections 10 \
                    --buffer-size 8192

    docs-check:
        # Catches API reference drift when src/ changes without docs/ changes.
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Install uv and set the Python version
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: uv sync

            - name: Type-check snippets
              run: uv run pyright --project docs

            - name: Build docs (strict)
              run: uv run mkdocs build --strict
