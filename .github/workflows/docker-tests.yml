name: Docker Integration Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
        paths:
            - "scripts/docker_start.sh"
            - "Dockerfile"
            - "wire/**"
            - "client/**"
            - "tests/test_docker_*.py"
            - "tests/support/docker.py"
            - ".github/workflows/docker-tests.yml"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    docker-integration-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14"]

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

            - name: Build Docker image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
              with:
                  context: .
                  load: true
                  tags: hassette:test
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      PYTHON_VERSION=${{ matrix.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  enable-cache: false

            - name: Run Docker integration tests
              run: |
                  uv run pytest tests/test_docker_*.py -v -m docker
              env:
                  HASSETTE_TEST_IMAGE: hassette:test
