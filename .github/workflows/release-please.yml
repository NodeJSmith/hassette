name: Release Please

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Release tag to publish (e.g. v0.38.0). Skips release-please and publishes directly."
                required: true
                type: string

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: release-please
    cancel-in-progress: false

jobs:
    release-please:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            pr: ${{ steps.release.outputs.pr }}
        steps:
            - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
              id: app-token
              with:
                  app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
              id: release
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    # Runs only on push when release-please opens/updates a PR (not on release or workflow_dispatch)
    sync-lockfile:
        needs: release-please
        if: needs.release-please.outputs.pr && needs.release-please.outputs.release_created != 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
              id: app-token
              with:
                  app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
                  token: ${{ steps.app-token.outputs.token }}
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
              with:
                  enable-cache: true

            - name: Sync uv.lock
              env:
                  APP_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  set -euo pipefail

                  # Re-lock, retrying the package-index resolve — the one network-flaky step.
                  for attempt in 1 2 3; do
                      uv lock && break
                      if [ "$attempt" = 3 ]; then
                          echo "::error::uv lock failed after 3 attempts"
                          exit 1
                      fi
                      echo "::warning::uv lock attempt ${attempt} failed; retrying in $((attempt * 5))s"
                      sleep $((attempt * 5))
                  done

                  if git diff --quiet uv.lock; then
                      echo "uv.lock already matches the version bump — nothing to push"
                      exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
                  git add uv.lock
                  git commit -m "chore: sync uv.lock with version bump"

                  # Push with a retry for transient failures. The workflow-level concurrency
                  # group serializes release-please runs, so the branch tip won't move under
                  # us mid-run — a rejected push here is almost always transient. The one case
                  # retries can't fix is a human pushing to the release branch mid-run (a genuine
                  # non-fast-forward); that exhausts the attempts and fails loudly, which is the
                  # signal to investigate rather than silently overwrite their commit.
                  for attempt in 1 2 3; do
                      git push origin HEAD && break
                      if [ "$attempt" = 3 ]; then
                          echo "::error::failed to push uv.lock sync after 3 attempts"
                          exit 1
                      fi
                      echo "::warning::push attempt ${attempt} failed; retrying in $((attempt * 3))s"
                      sleep $((attempt * 3))
                  done

    # After a release is created, replace the auto-generated GitHub Release notes
    # with the curated section from CHANGELOG.md (which we edit on the release-please
    # branch before merging). The auto-generated notes are release-please's raw PR
    # list; the curated version groups by topic, removes internal entries, and adds
    # contributor attribution.
    sync-release-notes:
        needs: release-please
        if: >-
            always()
            && (
              (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true')
              || github.event_name == 'workflow_dispatch'
            )
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  ref: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
                  persist-credentials: false

            # github.token (not the app token) is sufficient here: we only need
            # contents:write to edit the release body, and unlike sync-lockfile's
            # git push, this doesn't need to re-trigger downstream workflows.
            - name: Extract and sync release notes
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
              run: |
                  set -euo pipefail

                  version="${TAG_NAME#v}"

                  # Extract the section for this version from CHANGELOG.md.
                  # Captures everything between "## [<version>]" and the next "## [" heading.
                  notes=$(awk -v ver="$version" '
                    /^## \[/ {
                      if (found) exit
                      if (index($0, "## [" ver "]")) found=1
                      next
                    }
                    found { print }
                  ' CHANGELOG.md)

                  if [ -z "$notes" ]; then
                      echo "::warning::No CHANGELOG.md section found for version ${version} — skipping release notes sync"
                      exit 0
                  fi

                  echo "Syncing $(echo "$notes" | wc -l) lines of curated notes to GitHub Release ${TAG_NAME}"
                  notes_file=$(mktemp)
                  printf '%s\n' "$notes" > "$notes_file"
                  gh release edit "$TAG_NAME" --notes-file "$notes_file"
                  rm -f "$notes_file"

    build-pypi:
        needs: release-please
        if: >-
            always()
            && (
              (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true')
              || github.event_name == 'workflow_dispatch'
            )
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  ref: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
              with:
                  activate-environment: true
                  enable-cache: true

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Set up Python
              run: uv python install

            - name: Install Python packages
              run: uv sync

            - name: Build frontend SPA
              run: uv run nox -s frontend

            - name: Verify tag and workspace member versions match
              env:
                  TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
              run: |
                  PROJECT_VERSION=$(uv version --short)
                  uv run ./tools/release/check_tag_version.py --ref-name "$TAG_NAME" --project-version "$PROJECT_VERSION"

                  # The three packages release in lockstep: a member that release-please's
                  # extra-files missed would publish under a version nothing pins.
                  for member in hassette-wire hassette-client; do
                      member_version=$(uv version --short --package "$member")
                      if [ "$member_version" != "$PROJECT_VERSION" ]; then
                          echo "::error::$member is at $member_version but hassette is at $PROJECT_VERSION"
                          exit 1
                      fi
                  done

            # One dist directory per package: the PyPI publish action uploads a whole directory
            # (`packages-dir:`), so this is what lets each publish-pypi-* job upload only its own
            # package's files. The upload *order* comes from those jobs' `needs:` chain, not from
            # the directory split itself.
            - name: Build binary wheels and source tarballs
              run: |
                  uv build --package hassette-wire --out-dir dist/wire
                  uv build --package hassette-client --out-dir dist/client
                  uv build --package hassette --out-dir dist/hassette

            - name: Verify SPA assets in wheel
              run: uv run ./tools/release/check_wheel_spa.py --dist-dir dist/hassette

            - name: Publish build artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: pypi-dists
                  path: "./dist"

    # The three PyPI publish jobs are split one-per-package, each with its own GitHub
    # Environment, rather than three steps inside one job. PyPI's trusted-publisher match for a
    # project that doesn't exist yet (a "pending" publisher) is keyed on (repository, workflow
    # file, environment name) — it has no project name to disambiguate by, so hassette-wire and
    # hassette-client sharing one environment would be indistinguishable pending registrations
    # and PyPI refuses the second one. Each job calls the shared `_publish-pypi-package.yml`
    # reusable workflow (one retry-with-backoff sequence, one place to change it) with its own
    # `environment:`, which a `workflow_call` job can still declare per call. `needs:` chains the
    # jobs in upload order — hassette-wire, then hassette-client, then hassette — which is
    # load-bearing: each package pins the ones before it, so a half-finished publish only ever
    # leaves a newer package on PyPI that nothing depends on yet, never one published against a
    # dependency that isn't there.
    publish-pypi-wire:
        needs: [release-please, build-pypi]
        if: >-
            always()
            && needs.build-pypi.result == 'success'
        uses: ./.github/workflows/_publish-pypi-package.yml
        with:
            package-name: hassette-wire
            packages-dir: dist/wire
            environment-name: release-wire
            environment-url: https://pypi.org/p/hassette-wire
        permissions:
            id-token: write

    publish-pypi-client:
        needs: [release-please, build-pypi, publish-pypi-wire]
        if: >-
            always()
            && needs.publish-pypi-wire.result == 'success'
        uses: ./.github/workflows/_publish-pypi-package.yml
        with:
            package-name: hassette-client
            packages-dir: dist/client
            environment-name: release-client
            environment-url: https://pypi.org/p/hassette-client
        permissions:
            id-token: write

    publish-pypi:
        needs: [release-please, build-pypi, publish-pypi-client]
        if: >-
            always()
            && needs.publish-pypi-client.result == 'success'
        uses: ./.github/workflows/_publish-pypi-package.yml
        with:
            package-name: hassette
            packages-dir: dist/hassette
            environment-name: release
            environment-url: https://pypi.org/p/hassette
        permissions:
            id-token: write

    publish-docker:
        needs: [release-please, build-pypi]
        if: >-
            always()
            && needs.build-pypi.result == 'success'
        uses: ./.github/workflows/build_and_publish_image.yml
        with:
            tag_name: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
            is_release: true
        permissions:
            contents: read
            packages: write
            id-token: write

    # Verify even when build-pypi is skipped in a release context — a skipped build
    # during a release is itself the bug (see #998), and verification must catch it.
    release-verify:
        needs: [release-please, build-pypi, publish-pypi-wire, publish-pypi-client, publish-pypi, publish-docker]
        if: >-
            always()
            && (
              needs.build-pypi.result != 'skipped'
              || github.event_name == 'workflow_dispatch'
              || (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true')
            )
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Check publish results
              env:
                  BUILD_RESULT: ${{ needs.build-pypi.result }}
                  PYPI_WIRE_RESULT: ${{ needs.publish-pypi-wire.result }}
                  PYPI_CLIENT_RESULT: ${{ needs.publish-pypi-client.result }}
                  PYPI_RESULT: ${{ needs.publish-pypi.result }}
                  DOCKER_RESULT: ${{ needs.publish-docker.result }}
                  TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
              run: |
                  # Detect unexpected state where release was created but every publish job was skipped
                  if [ "$PYPI_WIRE_RESULT" = "skipped" ] && [ "$DOCKER_RESULT" = "skipped" ]; then
                      echo "::error::Both publish chains were skipped unexpectedly for release $TAG_NAME — inspect the publish workflow conditions and logs"
                      exit 1
                  fi

                  failed=""
                  if [ "$BUILD_RESULT" != "success" ]; then
                      failed="$failed Build($BUILD_RESULT)"
                  fi
                  if [ "$PYPI_WIRE_RESULT" != "success" ]; then
                      failed="$failed PyPI-wire($PYPI_WIRE_RESULT)"
                  fi
                  if [ "$PYPI_CLIENT_RESULT" != "success" ]; then
                      failed="$failed PyPI-client($PYPI_CLIENT_RESULT)"
                  fi
                  if [ "$PYPI_RESULT" != "success" ]; then
                      failed="$failed PyPI($PYPI_RESULT)"
                  fi
                  if [ "$DOCKER_RESULT" != "success" ]; then
                      failed="$failed Docker($DOCKER_RESULT)"
                  fi
                  if [ -n "$failed" ]; then
                      echo "::error::Partial release $TAG_NAME — failed:$failed"
                      echo "::notice::Recovery: re-run failed jobs, or trigger workflow_dispatch with tag_name=$TAG_NAME"
                      exit 1
                  fi
                  echo "All publish jobs succeeded for $TAG_NAME"

            - name: Verify package on PyPI
              if: needs.publish-pypi.result == 'success'
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  ref: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
                  sparse-checkout: tools/release/check_pypi_wheel.py
                  persist-credentials: false

            - name: Run PyPI smoke test
              if: needs.publish-pypi.result == 'success'
              env:
                  TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
              run: python3 ./tools/release/check_pypi_wheel.py --version "${TAG_NAME#v}"
