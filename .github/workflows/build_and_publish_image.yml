name: Build & Publish Image

on:
    pull_request:
        branches: [main] # publish pr-N tagged image for PR testing
        # Only when something the image is built from changes — mirror the Dockerfile's
        # COPY/ADD sources when editing this list. Safe as a trigger filter because `build`
        # isn't a required status check (a required check filtered out here would stay pending).
        paths:
            - "Dockerfile"
            - "docker/**"
            - ".dockerignore"
            - "src/**"
            - "frontend/**"
            - "scripts/**"
            - "tools/**"
            - "codegen/pyproject.toml"
            - "codegen/src/hassette_codegen/__init__.py"
            - "wire/**"
            - "client/**"
            - "pyproject.toml"
            - "uv.lock"
            - "README.md"
            - "LICENSE"
            - ".github/workflows/build_and_publish_image.yml"
    push:
        branches: [main] # publish main tagged image for bleeding-edge testing
    workflow_call: # called by release-please workflow
        inputs:
            tag_name:
                description: "Release tag (e.g. v0.24.0) — passed by release-please"
                required: true
                type: string
            is_release:
                # workflow_call inherits github.event_name from the top-level caller (e.g. "push"),
                # not "workflow_call" itself — so event_name can't distinguish a release invocation
                # from an ordinary push. The caller must say so explicitly instead. Getting this
                # wrong reproduces issue #1473: false on a real release silently drops the semver/
                # latest tags (and collapses the build matrix to a single Python version); true on
                # a non-release call publishes release tags for what should be a dev/PR build.
                description: "Whether this call publishes a real release (semver + latest tags)"
                required: true
                type: boolean
    workflow_dispatch: # manual trigger
        inputs:
            tag_name:
                description: "Release tag to publish (e.g. v0.24.0)"
                required: true
                type: string

permissions: {}

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            id-token: write
        timeout-minutes: 60
        # Release/dispatch predicate — true for a real release build (workflow_call from
        # release-please with is_release=true, or a manual workflow_dispatch), false for
        # PR/push dev builds. github.event_name alone can't tell these apart: workflow_call
        # inherits event_name from the top-level caller (e.g. "push"), not "workflow_call"
        # itself — the root cause of issue #1473 (releases silently degraded to a single-
        # python dev build with no semver tags). The same `inputs.is_release == true ||
        # github.event_name == 'workflow_dispatch'` expression is repeated below in
        # cancel-in-progress, matrix.python-version, and env.IS_RELEASE, and in build-addon's
        # cancel-in-progress and env.IS_RELEASE — GitHub Actions can't share an expression
        # across those scopes, so keep all five in sync if this predicate ever changes.
        concurrency:
            group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.tag_name || github.event.pull_request.number || github.ref }}-${{ matrix.python-version }}
            # Releases must run to completion so version/latest tags are never published half-finished.
            cancel-in-progress: ${{ !(inputs.is_release == true || github.event_name == 'workflow_dispatch') }}
        strategy:
            fail-fast: false
            matrix:
                # PRs and main-branch pushes build only 3.13 for speed; releases build all supported versions
                python-version: ${{ (inputs.is_release == true || github.event_name == 'workflow_dispatch') && fromJSON('["3.11", "3.12", "3.13", "3.14"]') || fromJSON('["3.13"]') }}
        outputs:
            # identical across the matrix, so whichever leg sets it last is fine
            version: ${{ steps.version.outputs.version }}
        env:
            IMAGE_NAME: hassette
            REGISTRY: ghcr.io
            OWNER: ${{ github.repository_owner }}
            PYTHON_VERSION: ${{ matrix.python-version }}
            IS_RELEASE: ${{ inputs.is_release == true || github.event_name == 'workflow_dispatch' }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ inputs.tag_name || github.ref }}
                  persist-credentials: false
                  # all tags, so check_tag_version.py can tell whether this release is the highest stable one
                  fetch-depth: 0

            - name: Set up QEMU
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

            - name: Login to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Install uv
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  activate-environment: true
                  enable-cache: false

            - name: Classify release tag # writes VERSION and IS_STABLE_RELEASE to GITHUB_ENV
              if: env.IS_RELEASE == 'true'
              env:
                  TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
              run: |
                  PROJECT_VERSION=$(uv version --short)
                  uv run ./tools/release/check_tag_version.py --ref-name "$TAG_NAME" --project-version "$PROJECT_VERSION"

            - name: Verify VERSION and IS_STABLE_RELEASE are set for releases
              if: env.IS_RELEASE == 'true'
              run: |
                  if [ -z "$VERSION" ]; then
                      echo "::error::VERSION env var not set after tag classification"
                      exit 1
                  fi
                  if [ -z "$IS_STABLE_RELEASE" ]; then
                      echo "::error::IS_STABLE_RELEASE env var not set after tag classification"
                      exit 1
                  fi

            - name: Expose VERSION to build-addon
              id: version
              if: env.IS_RELEASE == 'true'
              run: echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}
                  flavor: |
                      latest=false
                      suffix=-py${{ env.PYTHON_VERSION }}
                  tags: |
                      type=ref,event=pr,enable=${{ github.event_name == 'pull_request' }}
                      type=ref,event=branch,enable=${{ github.event_name == 'push' }}
                      type=raw,value=${{ env.VERSION }},enable=${{ env.IS_RELEASE == 'true' }}
                      type=raw,value=latest,enable=${{ env.IS_RELEASE == 'true' && env.IS_STABLE_RELEASE == 'true' }}

            - name: Build & Push
              # Fork-PR guard: skip only when the PR comes from a fork (forks can't push to GHCR).
              # push/workflow_call/workflow_dispatch always publish.
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.python-version }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.python-version }}
                  platforms: linux/amd64,linux/arm64
                  build-args: |
                      PYTHON_VERSION=${{ matrix.python-version }}

    # The Home Assistant add-on image (design/specs/129-ha-addon-v01/design.md, D3): docker/addon/Dockerfile on top
    # of the hassette image `build` just pushed. Supervisor pulls ghcr.io/<owner>/hassette-addon:<add-on version>,
    # so a release publishes the bare hassette version, built on one Python: the newest in `build`'s matrix.
    build-addon:
        needs: build
        # Fork-PR guard, as in `build`: a fork's PR pushes no base image to build on.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        concurrency:
            group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.tag_name || github.event.pull_request.number || github.ref }}-addon
            # Same release predicate as `build` (see the comment there).
            cancel-in-progress: ${{ !(inputs.is_release == true || github.event_name == 'workflow_dispatch') }}
        env:
            IMAGE_NAME: hassette-addon
            REGISTRY: ghcr.io
            OWNER: ${{ github.repository_owner }}
            IS_RELEASE: ${{ inputs.is_release == true || github.event_name == 'workflow_dispatch' }}
            VERSION: ${{ needs.build.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ inputs.tag_name || github.ref }}
                  persist-credentials: false

            - name: Verify VERSION is set for releases
              if: env.IS_RELEASE == 'true' && env.VERSION == ''
              run: |
                  echo "::error::build published no VERSION output"
                  exit 1

            - name: Set up QEMU
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

            - name: Login to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
              with:
                  images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}
                  flavor: |
                      latest=false
                  tags: |
                      type=ref,event=pr,enable=${{ github.event_name == 'pull_request' }}
                      # A release run inherits event_name "push" too; without the IS_RELEASE check it would also
                      # push :main, racing the ordinary main build (build's tags avoid this by their -py suffix).
                      type=ref,event=branch,enable=${{ github.event_name == 'push' && env.IS_RELEASE != 'true' }}
                      type=raw,value=${{ env.VERSION }},enable=${{ env.IS_RELEASE == 'true' }}

            # Rebuilds the tag `build` pushed for this event: its metadata step's tag plus the -py<version> suffix.
            # Releases build every Python in `build`'s matrix and the add-on takes the newest; dev builds have only
            # 3.13. Update these when that matrix changes.
            - name: Resolve the base image
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  if [ "$IS_RELEASE" = "true" ]; then
                      base_tag="${VERSION}-py3.14"
                  elif [ "$EVENT_NAME" = "pull_request" ]; then
                      base_tag="pr-${PR_NUMBER}-py3.13"
                  else
                      base_tag="${REF_NAME}-py3.13"
                  fi
                  # GHCR image names are lowercase; the owner may not be.
                  echo "BASE_IMAGE=${REGISTRY}/${OWNER,,}/hassette:${base_tag}" >> "$GITHUB_ENV"

            # VERSION is empty on dev builds, so their io.hass.version label is the dev tag (pr-N, main).
            - name: Build & Push
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
              with:
                  context: .
                  file: docker/addon/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  platforms: linux/amd64,linux/arm64
                  build-args: |
                      BASE_IMAGE=${{ env.BASE_IMAGE }}
                      VERSION=${{ env.VERSION || steps.meta.outputs.version }}
