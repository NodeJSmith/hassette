name: Publish package to PyPI (reusable)

# One retry-with-backoff sequence shared by every package in the publish-pypi-wire ->
# publish-pypi-client -> publish-pypi chain in release-please.yml. Each caller supplies its own
# `environment` here (rather than the callers sharing one job) because PyPI's *pending*
# trusted-publisher match, for a project that doesn't exist on PyPI yet, is keyed on
# (repository, workflow file, environment name) alone — two packages sharing one environment
# would register as the same pending publisher and PyPI would reject the second.

on:
    workflow_call:
        inputs:
            package-name:
                description: "Human-readable package name, used in step names and warning messages."
                required: true
                type: string
            packages-dir:
                description: "Directory (relative to the checkout) holding this package's built dist files."
                required: true
                type: string
            environment-name:
                description: "GitHub Environment name — must match the (repo, workflow, environment) triple registered as this package's PyPI trusted publisher."
                required: true
                type: string
            environment-url:
                description: "PyPI project URL, shown as this job's environment link."
                required: true
                type: string

permissions:
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment:
            name: ${{ inputs.environment-name }}
            url: ${{ inputs.environment-url }}
        permissions:
            id-token: write
        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: pypi-dists
                  path: "./dist"

            # No continue-on-error on attempt 3: the job fails hard if all three attempts fail,
            # which — via the caller's `needs:` chain — skips every package published after this one.
            - name: Publish ${{ inputs.package-name }} to PyPI (attempt 1)
              id: attempt1
              continue-on-error: true
              uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
              with:
                  packages-dir: ${{ inputs.packages-dir }}
                  skip-existing: true

            - name: Wait 30s before retry
              if: steps.attempt1.outcome == 'failure'
              env:
                  PACKAGE_NAME: ${{ inputs.package-name }}
              run: echo "::warning::$PACKAGE_NAME publish attempt 1 failed (likely transient Sigstore/network error), retrying..." && sleep 30

            - name: Publish ${{ inputs.package-name }} to PyPI (attempt 2)
              id: attempt2
              if: steps.attempt1.outcome == 'failure'
              continue-on-error: true
              uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
              with:
                  packages-dir: ${{ inputs.packages-dir }}
                  skip-existing: true

            - name: Wait 60s before retry
              if: steps.attempt2.outcome == 'failure'
              env:
                  PACKAGE_NAME: ${{ inputs.package-name }}
              run: echo "::warning::$PACKAGE_NAME publish attempt 2 failed, final retry..." && sleep 60

            - name: Publish ${{ inputs.package-name }} to PyPI (attempt 3)
              id: attempt3
              if: steps.attempt2.outcome == 'failure'
              uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
              with:
                  packages-dir: ${{ inputs.packages-dir }}
                  skip-existing: true
