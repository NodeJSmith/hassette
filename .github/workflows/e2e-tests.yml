name: E2E Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.filter.outputs.code }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
              id: filter
              with:
                  filters: |
                      code:
                        - 'src/**'
                        - 'wire/**'
                        - 'client/**'
                        - 'tests/e2e/**'
                        - 'frontend/**'
                        - 'pyproject.toml'
                        - 'uv.lock'
                        - 'noxfile.py'
                        - '.github/workflows/e2e-tests.yml'

    e2e:
        needs: changes
        if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        # Pinned: Playwright 1.58 refuses ubuntu-latest's 26.04 image ("does not support chromium").
        # Return to ubuntu-latest once a Playwright release supports 26.04.
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14"]

        env:
            TZ: America/Chicago

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Install uv and set the Python version
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  python-version: ${{ matrix.python-version }}

            - run: uv sync

            # The nox e2e session runs `npm ci` for the frontend build; pin Node so the lockfile is
            # read by the same npm major as the other frontend jobs.
            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            # Key the browser cache on the locked Playwright version, not the whole lockfile:
            # each Playwright release pins its own Chromium build, and nothing else in uv.lock
            # changes which browser gets downloaded.
            - name: Resolve Playwright version
              id: playwright
              run: echo "version=$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

            # System libraries aren't covered by the cache. When not run as root, Playwright
            # elevates the apt install itself; the nox session then installs the browser binary,
            # which is a no-op on a cache hit.
            - name: Install Playwright system dependencies
              run: uv run playwright install-deps chromium

            - name: Run e2e tests
              run: uv run nox -s e2e -p ${{ matrix.python-version }}

            - name: Upload test results
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: e2e-test-results-${{ matrix.python-version }}
                  path: test-results/
                  retention-days: 7

    e2e-complete:
        needs: [e2e]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Report result
              run: |
                  failed="${{ contains(needs.*.result, 'failure') }}"
                  cancelled="${{ contains(needs.*.result, 'cancelled') }}"
                  if [[ "$failed" == "true" || "$cancelled" == "true" ]]; then
                      echo "E2E tests failed or were cancelled"
                      exit 1
                  fi
                  echo "E2E tests passed or were skipped (no relevant changes)"
