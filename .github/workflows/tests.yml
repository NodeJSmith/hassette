name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.filter.outputs.code }}
            client_compat: ${{ steps.filter.outputs.client_compat }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
              id: filter
              with:
                  filters: |
                      code:
                        - 'src/**'
                        - 'wire/**'
                        - 'client/**'
                        - 'tests/**'
                        - 'frontend/**'
                        - 'pyproject.toml'
                        - 'uv.lock'
                        - 'noxfile.py'
                        - 'scripts/**'
                        - 'docker/**'
                        - '.github/workflows/docker-drift-check.yml'
                        - '.github/workflows/docs-inventory-drift.yml'
                        - '.github/workflows/ha-version-drift.yml'
                        - '.github/workflows/pypi-drift-check.yml'
                        - '.github/workflows/tests.yml'
                        - 'codegen/ha-version.txt'
                        - 'tools/release/drift_check.py'
                        - 'tools/docs/inventories.py'
                        - 'tools/check_client_floor.py'
                        - 'tools/check_wire_compat.py'
                        - 'tools/wire_compat_*.txt'
                        - 'tools/generate_client_compat_fixtures.py'
                        - 'tools/client_compat_*.py'
                        - 'tools/check_client_compat.py'
                        - '.github/actions/setup-oasdiff/**'
                        - 'mise.toml'
                      # All of src/: any module the routes import (schemas, types, config, services) can
                      # change a response body without touching wire/.
                      client_compat:
                        - 'wire/**'
                        - 'src/**'
                        - 'pyproject.toml'
                        - 'scripts/seed_db.py'
                        - 'scripts/seed_scenarios/**'
                        - 'tests/e2e/mock_fixtures/**'
                        - 'tests/support/**'
                        - 'tools/generate_client_compat_fixtures.py'
                        - 'tools/client_compat_*.py'
                        - 'tools/client_compat_ignore.txt'
                        - 'tools/check_client_compat.py'
                        - 'tools/check_wire_compat.py'
                        - 'noxfile.py'
                        - 'uv.lock'
                        - '.github/workflows/tests.yml'

    frontend:
        needs: changes
        if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0 # tools/check_wire_compat.py needs release tags, not just the default shallow history

            - name: Install uv and set the Python version
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  python-version: "3.13"

            - run: uv sync

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install frontend dependencies
              run: npm ci
              working-directory: frontend

            - name: Type-check frontend
              run: npm run typecheck
              working-directory: frontend

            - name: Run frontend tests with coverage
              run: npm run test:coverage
              working-directory: frontend

            - name: Upload frontend coverage
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: frontend-coverage
                  path: frontend/coverage/lcov.info

            - name: Regenerate schemas
              run: uv run python scripts/export_schemas.py

            - name: Check openapi.json and ws-schema.json are up to date
              run: git diff --exit-code frontend/openapi.json frontend/ws-schema.json

            - name: Check generated-types.ts is up to date
              run: npm run types && git diff --exit-code -- src/api/generated-types.ts
              working-directory: frontend

            - name: Check ws-types.ts is up to date
              run: npm run ws-types && git diff --exit-code -- src/api/ws-types.ts
              working-directory: frontend

            - name: Check ws-validator.generated.ts is up to date
              run: npm run validators && git diff --exit-code -- src/api/ws-validator.generated.ts
              working-directory: frontend

            - name: Build frontend
              run: npm run build
              working-directory: frontend

            - name: Check frontend bundle size
              run: npx size-limit
              working-directory: frontend

            - name: Set up oasdiff
              uses: ./.github/actions/setup-oasdiff

            - name: Run wire-compat check tests
              run: uv run pytest tests/unit/tools/test_check_wire_compat.py

            - name: Check wire compatibility against the latest release
              run: uv run python tools/check_wire_compat.py

    test:
        needs: changes
        if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 20

        env:
            TZ: America/Chicago

        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14"]

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Install fd-find
              run: sudo apt-get update && sudo apt-get install -y fd-find

            - name: Install uv and set the Python version
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  python-version: ${{ matrix.python-version }}

            - run: uv sync

            # Coverage collected on 3.14 only — no version-gated code paths in
            # the source, so one version gives the same coverage data as four.
            # 3.14 also gets sysmon (PEP 669) automatically, the fastest backend.
            - name: Run tests with coverage
              if: matrix.python-version == '3.14'
              run: uv run nox -t coverage -p ${{ matrix.python-version }}

            - name: Run tests without coverage
              if: matrix.python-version != '3.14'
              run: uv run nox -s tests -p ${{ matrix.python-version }}

            - name: Upload coverage data
              if: matrix.python-version == '3.14'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: .coverage.${{ matrix.python-version }}
                  path: .coverage.${{ matrix.python-version }}
                  include-hidden-files: true

    workspace-members:
        needs: changes
        if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0 # tools/check_client_floor.py reads release tags to find the client's floor release

            - name: Install uv and set the Python version
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  python-version: "3.13"

            - run: uv sync

            - name: Set up oasdiff
              uses: ./.github/actions/setup-oasdiff

            - name: Test hassette-wire and hassette-client
              run: uv run nox -s wire client

            - name: Run client floor check tests
              run: uv run pytest tests/unit/tools/test_check_client_floor.py

            # Fails the PR that makes the client need server API its floor release lacks, until that PR
            # raises API_SCHEMA_VERSION and MIN_API_SCHEMA_VERSION (.claude/rules/client-schema-floor.md).
            - name: Check hassette-client against its floor release
              run: uv run python tools/check_client_floor.py

    client-compat:
        needs: changes
        if: needs.changes.outputs.client_compat == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0 # the fixtures are typed by the latest release tag's openapi.json

            - name: Install uv and set the Python version
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  python-version: "3.13"

            - run: uv sync

            # Fails unless the newest published hassette-client release reachable from HEAD handles every
            # response HEAD sends: parses its bodies and probe bodies, and maps its errors.
            - name: Check HEAD's responses against the released hassette-client
              run: uv run nox -s client_compat

            - name: Upload the fixtures on failure
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: client-compat-fixtures
                  path: .nox/client_compat/tmp/client-compat-fixtures/
                  retention-days: 7

    system:
        needs: changes
        if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 20

        env:
            TZ: America/Chicago

        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14"]

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  python-version: ${{ matrix.python-version }}

            - run: uv sync

            # Same coverage-on-3.14-only rationale as the test job.
            - name: Run system tests with coverage
              if: matrix.python-version == '3.14'
              run: uv run nox -s system_with_coverage -p ${{ matrix.python-version }}

            - name: Run system tests without coverage
              if: matrix.python-version != '3.14'
              run: uv run nox -s system -p ${{ matrix.python-version }}

            - name: Upload coverage data
              if: matrix.python-version == '3.14'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: .coverage.system.${{ matrix.python-version }}
                  path: .coverage.system.${{ matrix.python-version }}
                  include-hidden-files: true

    combine-and-report:
        needs: [frontend, test, system]
        if: |
            always() &&
            !contains(needs.*.result, 'failure') &&
            !contains(needs.*.result, 'cancelled') &&
            (needs.frontend.result == 'success' || needs.test.result == 'success' || needs.system.result == 'success')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Install uv and set the Python version
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  python-version: 3.11

            - name: Install coverage
              run: |
                  uv venv
                  uv pip install -U 'coverage[toml]'

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  path: coverage-parts
                  pattern: .coverage.*
                  merge-multiple: true

            - name: Download frontend coverage
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: frontend-coverage
                  path: frontend-coverage

            - name: Combine coverage and report
              run: |
                  uv run coverage combine coverage-parts
                  uv run coverage xml -o coverage.xml
                  uv run coverage report

            - name: Upload HTML report (artifact)
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: coverage-html
                  path: htmlcov

            - name: Upload XML for integrations
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: coverage-xml
                  path: coverage.xml

            - name: Upload coverage to Codecov
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
              with:
                  files: coverage.xml,frontend-coverage/lcov.info
                  fail_ci_if_error: true
                  verbose: true
                  name: codecov-${{ github.run_id }}
                  token: ${{ secrets.CODECOV_TOKEN }}
                  flags: backend,frontend

    tests-complete:
        # changes is listed so a failed path filter fails this check; otherwise every job it gates would be
        # skipped and read as passing.
        needs: [changes, frontend, test, workspace-members, client-compat, system, combine-and-report]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Report result
              run: |
                  failed="${{ contains(needs.*.result, 'failure') }}"
                  cancelled="${{ contains(needs.*.result, 'cancelled') }}"
                  if [[ "$failed" == "true" || "$cancelled" == "true" ]]; then
                      echo "One or more test jobs failed or were cancelled"
                      exit 1
                  fi
                  echo "All tests passed or were skipped (no relevant changes)"
