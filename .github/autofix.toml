# The autofix pipeline's recipe for this repo, read from the default branch at the start of each
# run (Dotfiles packages/autofix/src/autofix/recipe.py). A PR can't change what its own review
# session runs: edits here take effect once they merge. An automated PR that edits this file is
# parked for a human to merge or close; it is never auto-merged.
schema_version = 2

[review]
# Workflow `name:` values whose failures get CI triage (rerun or park) instead of a review session.
test_workflows = ["Tests", "E2E Tests", "Docker Integration Tests"]
# Inserted into the review skill as its "Repo checks" section.
checks = """
**Triage.** The `file-sizes` and `duplicate-code` gates are the ones autofix PRs trip most: a red one always means this PR grew an oversized file or added a duplicate block, so it's a **Fix**, never a skip (`.claude/reference/github-workflow.md` explains both gates). Shrink or move code to fix a file-size failure; don't contort it just to hit the count. An aggregate job like `lint-complete` fails whenever one of its inputs does, so fix the input.

**After each fix.** If the fix touches web models or schemas, regenerate: `uv run python scripts/export_schemas.py --types`

**Before committing.** Run `prek -a` and `prek run pyright -a --stage pre-push`.

**After committing.** Run `mise run gates`: the two merge-blocking new-code gates, the same mise tasks CI's `file-sizes` and `duplicate-code` jobs and the pre-push hooks run. Run them here anyway so the result doesn't depend on hooks being installed; a fix can trip them on its own. Both compare commits, so run them after committing.

If either fails, fix it, amend, and repeat the before-committing checks and `mise run gates` on the amended commit before pushing. Moving code to fix a file-size failure can break imports or types or add duplication, and a duplication fix can grow a file, so earlier results don't cover the amended `HEAD`.
"""

[fix]
# Inserted into the fix prompt as its "Repo checks" section.
checks = """
**Public surface.** Besides wire models, documented API and CLI output, the hassette-wire and hassette-client packages are published interfaces.

**Frontend.** If your fix touches rendered frontend files (`frontend/src/**/*.tsx` or `frontend/src/**/*.css`), verify it visually before committing — do not trust the diff alone. Start the demo stack (`uv run python scripts/hassette_demo.py`, in the background; wait for "Demo ready."), then capture a screenshot scoped to the affected page/viewport with `uv run python tools/frontend/ui_qa_capture.py --output-dir <tmpdir> --pages <page> --viewports <width>` (see `.claude/skills/ui-qa/references/harness.md` for the full harness and its gotchas) and actually look at the image. Save the screenshot(s) you relied on under `docs/pr-evidence/` (create the directory if it doesn't exist; add `pr-evidence/**` to `exclude_docs` in `mkdocs.yml` if it isn't already there, so these ad hoc verification images are committed for CI evidence but never published into the built docs site) and commit them with the fix — `tools/frontend/check_pr_screenshots.py` blocks CI on any PR touching those files with no visual evidence attached. Tear the demo stack down when you're done with it.

**Docs.** If your fix adds or edits prose or code examples in `docs/**/*.md` (screenshots under `docs/pr-evidence/` don't count), re-read `.claude/rules/voice-guide.md` once your edits are done and check every sentence you added or changed against it before committing; PR review enforces it. `.claude/rules/doc-rules.md` covers page structure and snippet mechanics, and where its voice advice conflicts with the voice guide, the voice guide wins. The rules most often broken: concept pages, API-reference pages, and a recipe's "How It Works" section make the system the subject ("you" is allowed only on getting-started pages and in recipe procedure and variation steps); explanatory sentences stay around 10-18 words; the main behavior comes before its caveats, and each limitation is paired with what to do instead; new code examples come from tested snippet files via `--8<--` includes, never inline blocks. Apply these only to text and examples you add or change, and leave pre-existing violations on untouched lines alone.

**Tests, lint and types.** Run tests with `uv run nox -s dev`. Run `prek -a --no-group frontend` for lint and type checks; if the change touches anything under `frontend/`, use plain `prek -a` instead, so the frontend hooks run too.

**New-code gates.** `mise run gates` runs both, the same tasks CI runs on every PR:
- `gates:file-sizes` fails if your change grows a file past 800 lines, or grows one that's already over. Fix by splitting the file or moving code out, not by adding a suppression pragma.
- `gates:duplicates` fails if your change adds a 3rd+ copy of a code block (it takes about a minute). Fix by extracting the shared block into a helper or fixture, not by adding `dup-ignore` markers.
"""
# Inserted into the ship prompt as its "Repo checks" section.
ship_checks = """
**Why CI covers the rest.** The backend suite (`uv run nox -s dev`) takes far longer than any single command here can safely block on, and `.github/workflows/tests.yml` runs the complete backend + system + frontend suite, on every Python version hassette supports, on every PR. Never run `uv run nox -s dev` here.

**Lint and type checks.** `prek -a --no-group frontend`. If the change touches anything under `frontend/`, use plain `prek -a` instead, so the frontend hooks run too.

**New-code gates.** `mise run gates` (the duplicate-code half takes about a minute).

**Repairs the repair pass may make**, besides a formatter or a lint rule's `--fix`:
- a drift snapshot (`tools/check_cli_drift.py`) whose drift is the change this branch meant to make: run `uv run python tools/check_cli_drift.py --update`. This is the one repair that may go beyond the failing file: also update the docs page describing that CLI surface, since the snapshot only proves the code matches itself.
- house-lint HSL004 (module constants defined after the first function): move the constants up.

**PR body.** If the branch includes evidence screenshots under `docs/pr-evidence/`, add a `## Screenshots` section embedding each one inline via its raw GitHub URL (`https://raw.githubusercontent.com/NodeJSmith/hassette/<sha>/<path>`, where `<sha>` is the full `git rev-parse HEAD` of the commit you just pushed) so a reviewer sees the visual result without opening the diff. Never use the branch name in the URL: the branch is deleted on merge and a branch-scoped link 404s, while the PR keeps its commits reachable by SHA.
"""
